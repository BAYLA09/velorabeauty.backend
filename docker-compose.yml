# Local development template — do not put production secrets in this file.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: velora
      POSTGRES_PASSWORD: velora_dev_password
      POSTGRES_DB: velorabeauty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://velora:velora_dev_password@postgres:5432/velorabeauty?schema=public
      STORE_API_KEY: local-dev-store-api-key-32chars
      GROK_AGENT_API_KEY: local-dev-grok-agent-key-32chars
      EMAIL_FROM: dev@localhost
      EMAIL_REPLY_TO: dev@localhost
      EMAIL_PROVIDER: console
    depends_on:
      - postgres

volumes:
  postgres_data:
